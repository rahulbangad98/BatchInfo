<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Batch Lookup | Bangad Farms</title>
  <meta name="description" content="Enter your batch number to see where your product came from, when it was harvested, and its lab results.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <p class="brand">Bangad Farms</p>
      <h1>Find your batch</h1>
      <p class="lead">Type the batch number printed on your pack to see where it was grown, when it was harvested, and its lab result.</p>
    </header>

    <form id="search-form" class="search" autocomplete="off">
      <label for="batch-input" class="visually-hidden">Batch number</label>
      <input id="batch-input" type="text" placeholder="e.g. Batch 1" required>
      <button type="submit">Search batch</button>
    </form>

    <section id="result" aria-live="polite"></section>
  </main>

  <footer class="wrap">
    <p>Can't find your batch? Check the number on the pack and try again.</p>
  </footer>

  <script src="batches.js"></script>
  <script src="script.js"></script>
</body>
</html>
